[project]
name = "observability-comparison"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7",
    "boto3>=1.35",
    "braintrust>=0.0.154",
    "autoevals>=0.0.100",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
