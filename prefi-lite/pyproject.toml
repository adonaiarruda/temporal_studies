[project]
name = "prefi-lite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn",
    "pydantic>=2.0",
    "python-dotenv",
    "langsmith>=0.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "moto[bedrock]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
